name: flutter_download_manager
description: Flutter Download Manager is a Cross-Platform file downloader with resumeable, parallel and batch Download support. Also be notified of download status and progress updates
version: 0.5.7
homepage: https://github.com/nabil6391/flutter_download_manager

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.0.2
  collection: ^1.17.1
  file_system_access_api: ^2.0.0
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterDownloadManagerWeb
        fileName: lib/download_manager_web.dart
