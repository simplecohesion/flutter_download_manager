version: 0.5.7
homepage: https://github.com/nabil6391/flutter_download_manager

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  collection: ^1.17.1
  dio: ^5.0.2
  file_system_access_api: ^2.0.0
  flutter:
    sdk: flutter
  universal_io: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
